plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'maven-publish'
	id 'org.sonarqube' version '7.2.2.6593'
	id 'jacoco'
}

group = 'mtech.swe5006'
version = '0.0.1-SNAPSHOT'
description = 'Group 1 Project. Members : CALLUM TAN DAI MIN, FOO CHUAN YONG, LAW SONG MING, PYIE SONE, RUBY FERDIANTO, VINOTH KANNAN ROHINI, MARK TEO'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

configurations.configureEach {
	resolutionStrategy.force(
		'io.netty:netty-codec-http:4.2.12.Final',
		'io.netty:netty-codec-http2:4.2.12.Final',
		'io.netty:netty-codec-http3:4.2.12.Final',
		'io.netty:netty-handler-proxy:4.2.12.Final',
		'com.fasterxml.jackson.core:jackson-core:2.21.2',
		'com.fasterxml.jackson.core:jackson-databind:2.21.2',
		'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.2',
		'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.2',
		'tools.jackson.core:jackson-core:3.1.1',
		'tools.jackson.core:jackson-databind:3.1.1'
	)
}

def githubOwner = findProperty('gpr.owner') ?: System.getenv('GH_PACKAGES_OWNER')
def githubRepo = findProperty('gpr.repo') ?: System.getenv('GH_PACKAGES_REPO') ?: rootProject.name
def githubUser = findProperty('gpr.user') ?: System.getenv('GH_PACKAGES_USER')
def githubToken = System.getenv('GH_PACKAGES_TOKEN') ?: findProperty('gpr.key')

repositories {
	mavenCentral()

	if (githubOwner) {
		maven {
			name = 'GitHubPackages'
			url = uri("https://maven.pkg.github.com/${githubOwner}/${githubRepo}")
			credentials {
				username = githubUser
				password = githubToken
			}
		}
	}
}

ext {
	set('springModulithVersion', "2.0.2")
}

dependencies {
	constraints {
		implementation('org.springframework.security:spring-security-web:7.0.4')
		implementation('org.springframework:spring-web:7.0.6')
		implementation('org.springframework:spring-webmvc:7.0.6')
		implementation('io.netty:netty-codec-http:4.2.12.Final')
		implementation('io.netty:netty-codec-http2:4.2.12.Final')
		implementation('io.netty:netty-codec-http3:4.2.12.Final')
		implementation('io.netty:netty-handler-proxy:4.2.12.Final')
		implementation('com.fasterxml.jackson.core:jackson-core:2.21.2')
		implementation('com.fasterxml.jackson.core:jackson-databind:2.21.2')
		implementation('com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.2')
		implementation('com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.2')
		implementation('tools.jackson.core:jackson-core:3.1.1')
		implementation('tools.jackson.core:jackson-databind:3.1.1')
	}

	implementation 'com.auth0:java-jwt:4.4.0'
	implementation 'com.azure:azure-storage-blob:12.29.1'

	// Audit logging sinks (added by feature/audit-logging — missing from build.gradle)
	implementation 'com.microsoft.azure:applicationinsights-runtime-attach:3.6.2'
	implementation 'io.opentelemetry:opentelemetry-api:1.40.0'
	implementation 'io.sentry:sentry:7.14.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'

	// Force fixed Logback versions
	implementation 'ch.qos.logback:logback-core:1.5.25'
	implementation 'ch.qos.logback:logback-classic:1.5.25'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

// Publish a standard Java artifact for downstream Gradle/Maven consumers.
tasks.named('jar') {
	enabled = true
}

publishing {
	publications {
		gpr(MavenPublication) {
			from components.java
		}
	}
	if (githubOwner) {
		repositories {
			maven {
				name = 'GitHubPackages'
				url = uri("https://maven.pkg.github.com/${githubOwner}/${githubRepo}")
				credentials {
					username = githubUser
					password = githubToken
				}
			}
		}
	}
}

tasks.named('generateMetadataFileForGprPublication') {
	suppressedValidationErrors.add('dependencies-without-versions')
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
	}
}

sonar {
	properties {
		property 'sonar.sourceEncoding', 'UTF-8'
		property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
	}
}