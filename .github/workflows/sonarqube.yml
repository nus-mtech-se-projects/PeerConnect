name: SonarQube Code Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  SONAR_HOST_URL: http://localhost:9000
  SONAR_PROJECT_KEY: peerconnect

jobs:
  sonarqube-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for blame/new code detection

      - name: Start SonarQube
        run: docker run -d \
              --name peerconnect-sonar \
              -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
              --ulimit nofile=65536:65536 \
              -p 9000:9000 \
              sonarqube:community

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Wait for SonarQube to be ready
        run: |
          echo "Waiting for SonarQube to start..."
          for i in $(seq 1 40); do
            STATUS=$(curl -s http://localhost:9000/api/system/status | jq -r '.status' 2>/dev/null || echo "UNKNOWN")
            echo "Attempt $i: SonarQube status = $STATUS"
            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is ready"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "SonarQube failed to start in time — printing logs"
              docker compose -f .github/workflows/docker-compose.yml logs
              exit 1
            fi
            sleep 15
          done

      - name: Configure SonarQube admin and generate token
        id: sonar-token
        run: |
          # Change the default admin password on first boot
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u admin:admin \
            -X POST "http://localhost:9000/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=Admin@SonarCI1!")
          echo "Password change HTTP status: $HTTP_CODE"

          # Generate a scoped project analysis token for this run
          TOKEN=$(curl -s -u admin:Admin@SonarCI1! \
            -X POST "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-run-${{ github.run_id }}" | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to generate SonarQube token"
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: ./gradlew clean test

      - name: Run SonarQube analysis
        run: |
          ./gradlew sonar \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ steps.sonar-token.outputs.token }} \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.projectName="PeerConnect" \
            -Dsonar.java.source=21

      - name: Check SonarQube Quality Gate
        run: |
          echo "Waiting for analysis to be processed..."
          sleep 20

          RESPONSE=$(curl -s -u admin:Admin@SonarCI1! \
            "http://localhost:9000/api/qualitygates/project_status?projectKey=${{ env.SONAR_PROJECT_KEY }}")
          echo "$RESPONSE" | jq .

          STATUS=$(echo "$RESPONSE" | jq -r '.projectStatus.status')
          echo "Quality Gate status: $STATUS"

          if [ "$STATUS" = "ERROR" ]; then
            echo "Quality Gate FAILED — code does not meet quality/security standards"
            exit 1
          fi

      - name: Export critical and blocker issues
        if: always()
        run: |
          curl -s -u admin:Admin@SonarCI1! \
            "http://localhost:9000/api/issues/search?projectKeys=${{ env.SONAR_PROJECT_KEY }}&severities=CRITICAL,BLOCKER&ps=100" \
            | jq '.' > sonar-issues.json
          echo "Issues found:"
          jq '.total' sonar-issues.json

      - name: Upload SonarQube report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report-${{ github.run_id }}
          path: sonar-issues.json
          retention-days: 14

      - name: Stop SonarQube
        if: always()
        run: docker compose -f .github/workflows/docker-compose.yml down -v
