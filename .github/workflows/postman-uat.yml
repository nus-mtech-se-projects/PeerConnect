name: Postman UAT Testing

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target environment base URL (overrides default live site URL)"
        required: false
        default: ""

env:
  BASE_URL: ${{ github.event.inputs.base_url || vars.AZURE_STATIC_WEB_APP_URL || 'https://salmon-island-0f8625f00.6.azurestaticapps.net' }}

jobs:
  postman-uat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Wait for application to be reachable
        env:
          APP_URL: ${{ env.BASE_URL }}
        run: .github/scripts/wait-for-app.sh

      - name: Run Postman collection
        env:
          BASE_URL: ${{ env.BASE_URL }}
          REPORT_TITLE: PeerConnect UAT Report - ${{ env.BASE_URL }}
        run: .github/scripts/run-postman-uat.sh

      - name: Upload UAT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-uat-report-${{ github.run_id }}
          path: postman-uat-report.html
          retention-days: 7

      - name: Cleanup UAT test data
        if: always()
        env:
          AZURE_SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ vars.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: .github/scripts/cleanup-uat-test-data.sh
