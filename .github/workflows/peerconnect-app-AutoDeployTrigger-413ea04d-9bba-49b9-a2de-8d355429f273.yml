name: Trigger auto deployment for peerconnect-app

# Disabled - ACR (ca5accbde616acr) was deleted; deployment is handled by end-to-end-cicd.yml
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PEERCONNECTAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PEERCONNECTAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PEERCONNECTAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.PEERCONNECTAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PEERCONNECTAPP_REGISTRY_PASSWORD }}
          containerAppName: peerconnect-app
          resourceGroup: peerconnect
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


