name: End-to-End CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build application
        run: ./gradlew clean build

      - name: Resolve artifact path
        id: artifact
        run: |
          JAR_PATH=$(ls -1 build/libs/*.jar | grep -v -- '-plain.jar' | head -n 1)
          echo "jar_path=${JAR_PATH}" >> "$GITHUB_OUTPUT"

      - name: Create deployment zip
        run: |
          mkdir -p deploy
          cp "${{ steps.artifact.outputs.jar_path }}" deploy/app.jar
          cd deploy
          zip -r ../app.zip app.jar

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-zip-${{ github.sha }}
          path: app.zip
          retention-days: 1

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ github.sha }}
          path: build/reports/jacoco/test/jacocoTestReport.xml
          retention-days: 1

  sonarcloud:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate SonarCloud configuration
        if: ${{ secrets.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        run: |
          if [ -z "${{ env.SONAR_ORGANIZATION }}" ]; then
            echo "Missing repository variable: SONAR_ORGANIZATION"
            exit 1
          fi
          if [ -z "${{ env.SONAR_PROJECT_KEY }}" ]; then
            echo "Missing repository variable: SONAR_PROJECT_KEY"
            exit 1
          fi

      - name: Download JaCoCo report
        if: ${{ secrets.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-${{ github.sha }}
          path: build/reports/jacoco/test

      - name: Set up Java
        if: ${{ secrets.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        if: ${{ secrets.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Run SonarCloud analysis
        if: ${{ secrets.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew classes testClasses sonar \
            -x test \
            -x jacocoTestReport \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}"

      - name: Skip SonarCloud analysis when configuration is missing
        if: ${{ secrets.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "SONAR_TOKEN or SONAR_HOST_URL is not configured; skipping SonarCloud analysis."

  dependency-scan:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@master

      - name: Run Snyk dependency scan
        if: ${{ env.SNYK_TOKEN != '' }}
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        run: snyk test --file=build.gradle --package-manager=gradle --severity-threshold=high

      - name: Skip Snyk scan when token is missing
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "SNYK_TOKEN is not configured; skipping Snyk scan."

  deploy-azure:
    needs:
      - build
      - sonarcloud
      - dependency-scan
    runs-on: ubuntu-latest

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: app-zip-${{ github.sha }}

      - name: Validate Azure deployment configuration
        run: |
          if [ -z "${{ env.AZURE_WEBAPP_NAME }}" ]; then
            echo "Missing repository variable: AZURE_WEBAPP_NAME"
            exit 1
          fi
          if [ -z "${{ vars.AZURE_WEBAPP_URL }}" ]; then
            echo "Missing repository variable: AZURE_WEBAPP_URL"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "Missing secret: AZURE_WEBAPP_PUBLISH_PROFILE"
            exit 1
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

  postman-uat:
    needs: deploy-azure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate UAT configuration
        run: |
          if [ -z "${{ vars.AZURE_WEBAPP_URL }}" ]; then
            echo "Missing repository variable: AZURE_WEBAPP_URL"
            exit 1
          fi
          if [ -z "${{ vars.AZURE_SQL_SERVER }}" ]; then
            echo "Missing repository variable: AZURE_SQL_SERVER"
            exit 1
          fi
          if [ -z "${{ vars.AZURE_SQL_DATABASE }}" ]; then
            echo "Missing repository variable: AZURE_SQL_DATABASE"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_SQL_USERNAME }}" ]; then
            echo "Missing secret: AZURE_SQL_USERNAME"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_SQL_PASSWORD }}" ]; then
            echo "Missing secret: AZURE_SQL_PASSWORD"
            exit 1
          fi

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Wait for application to be reachable
        env:
          APP_URL: ${{ vars.AZURE_WEBAPP_URL }}
        run: .github/scripts/wait-for-app.sh

      - name: Run PosSIlitman collection
        env:
          BASE_URL: ${{ vars.AZURE_WEBAPP_URL }}
          REPORT_TITLE: PeerConnect UAT Report
        run: .github/scripts/run-postman-uat.sh

      - name: Upload UAT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-uat-report-${{ github.run_id }}
          path: postman-uat-report.html
          retention-days: 7

      - name: Cleanup UAT test data
        if: always()
        env:
          AZURE_SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ vars.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: .github/scripts/cleanup-uat-test-data.sh
