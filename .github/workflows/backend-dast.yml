name: Backend DAST (OWASP ZAP)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  dast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Wait for application to be reachable
        env:
          APP_URL: ${{ vars.AZURE_WEBAPP_URL }}
        run: .github/scripts/wait-for-app.sh

      - name: Authenticate and obtain JWT
        id: auth
        env:
          APP_URL: ${{ vars.AZURE_WEBAPP_URL }}
          DAST_USER_EMAIL: ${{ secrets.DAST_USER_EMAIL }}
          DAST_USER_PASSWORD: ${{ secrets.DAST_USER_PASSWORD }}
        run: .github/scripts/dast-auth.sh

      - name: Run ZAP API scan
        env:
          APP_URL: ${{ vars.AZURE_WEBAPP_URL }}
          DAST_TOKEN: ${{ steps.auth.outputs.token }}
        run: .github/scripts/run-zap-api-scan.sh

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-backend-report-${{ github.run_number }}
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 7

      - name: Cleanup DAST password reset rows
        if: always()
        env:
          DAST_USER_EMAIL: ${{ secrets.DAST_USER_EMAIL }}
          AZURE_SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ vars.AZURE_SQL_DATABASE }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: .github/scripts/cleanup-dast-password-resets.sh
