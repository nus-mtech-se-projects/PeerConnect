name: Backend DAST (OWASP ZAP)

on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - "new_devsecops_pipelines"
  workflow_dispatch:

jobs:
  dast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.AZURE_WEBAPP_URL }}
          fail_action: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-backend-report-${{ github.run_number }}
          path: report_html.html
          retention-days: 30
